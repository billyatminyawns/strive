name = "strive-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Secrets (set via `npx wrangler secret put <NAME>`, never in this file):
#   ANTHROPIC_API_KEY  — console.anthropic.com (Claude drafts; without it /v1 drafting is off)
#   FISH_API_KEY       — fish.audio API credit (Angela's cloned voice)
#   WELLSAID_API_KEY   — developer.wellsaidlabs.com (legacy /voice fallback)
#   ATHLETE_KEYS       — JSON {"<studio key>": "<athlete id>"} for POST /v1/auth/athlete
#   AUTOPILOT_MODE     — "review" (default) | "grounded" — see below
#   RESEND_API_KEY     — resend.com API key: sends v1.2 sign-in codes (email sign-in is on when this
#                        and EMAIL_FROM are both set)
#   EMAIL_FROM         — e.g. "Strive <signin@yourdomain.com>", on a domain verified in Resend
#   GOOGLE_CLIENT_ID   — Google OAuth Web client id for "Sign in with Google" (public, but a secret so
#                        a deploy never resets it)
# Optional: EMAIL_DAILY_CAP (sign-in emails per 24 h across everyone, default 500). Test-only overrides
# RESEND_BASE_URL / GOOGLE_JWKS_URL are ignored unless they point at 127.0.0.1 / localhost.

[vars]
ALLOWED_ORIGINS = "https://billyatminyawns.github.io,http://localhost:8642,http://127.0.0.1:8642"
DRAFT_MODEL = "claude-opus-5-5"
# Coach Angela autopilot lives in the AUTOPILOT_MODE *secret* (not a var: a later deploy would
# silently reset a var). Unset or "review" = every new answer waits for Angela (safe default).
# "grounded" = replies fully grounded in her verified record may send on their own, and only when
# Angela also has autopilot on in her studio. scripts/go-live.sh sets it after asking about consent.
AUTOPILOT_MIN_CONFIDENCE = "0.75"
BRAIN_EFFORT = "medium"
MIN_BUILD = "1"

[[d1_databases]]
binding = "DB"
database_name = "strive-db"
database_id = "348e52b6-46cc-439e-b873-845dc1af1aaf"

[[kv_namespaces]]
binding = "AUDIO"
id = "74506e1025f24325b27fb658216dcb6a"

# Daily drop at 14:00 UTC (7:00 AM Pacific) — keep PUBLISH_HOUR_UTC in src/v1.js in sync.
[triggers]
crons = ["0 14 * * *"]
